name: Refresh publications

# Bakes the Semantic Scholar publication list into index.html so it is present
# in the raw HTML that search engines index, rather than only after JS runs.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-python step: ubuntu-latest ships Python 3, and
      # build_publications.py uses only the standard library. One fewer action
      # to keep current as runner Node versions get deprecated.
      - name: Regenerate publication markup
        run: python3 scripts/build_publications.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain index.html)" ]]; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh publications from Semantic Scholar"
          git push
